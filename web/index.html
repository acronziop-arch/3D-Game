html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overscroll-behavior: none;
}

body {
	position: fixed;
	inset: 0;
	color: #3E342B;
	background-color: #DCD3C6;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
	position: fixed;
	inset: 0;
	width: 100vw;
	height: 100vh;
}

#canvas:focus {
	outline: none;
}

/* --- Экран загрузки ------------------------------------------------------------------------- */

#status {
	position: fixed;
	inset: 0;
	z-index: 10;
	overflow: hidden;
	background: linear-gradient(180deg, #F8F3EA 0%, #F3ECE1 55%, #E8DDCD 100%);
	font-family: ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
	transition: opacity 0.7s ease;
}

#status.gone {
	opacity: 0;
	pointer-events: none;
}

#status-scene {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	width: 100%;
	height: 46%;
	pointer-events: none;
}

.cloud {
	position: absolute;
	height: 26px;
	border-radius: 20px;
	background: rgba(255, 255, 255, 0.85);
	box-shadow: 0 2px 0 rgba(201, 184, 166, 0.35);
	animation: drift linear infinite;
}

.cloud::before, .cloud::after {
	content: '';
	position: absolute;
	bottom: 8px;
	border-radius: 50%;
	background: inherit;
}

.cloud::before {
	left: 14%;
	width: 42%;
	height: 34px;
}

.cloud::after {
	right: 16%;
	width: 34%;
	height: 26px;
}

@keyframes drift {
	from { transform: translateX(-30vw); }
	to { transform: translateX(130vw); }
}

#status-card {
	position: absolute;
	inset: 0 0 18% 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 10px;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

#status-logo {
	width: clamp(64px, 15vmin, 110px);
	height: clamp(64px, 15vmin, 110px);
	border-radius: 24%;
	box-shadow: 0 10px 24px rgba(62, 52, 43, 0.22), 0 0 0 3px #FFFFFF;
	animation: bob 2.4s ease-in-out infinite;
}

@keyframes bob {
	0%, 100% { transform: translateY(0) rotate(-2deg); }
	50% { transform: translateY(-8px) rotate(2deg); }
}

#status-title {
	margin-top: 6px;
	font-size: clamp(30px, 8vmin, 56px);
	font-weight: 900;
	letter-spacing: 0.02em;
	color: #3E342B;
	text-shadow: 0 2px 0 #FFFFFF;
}

#status-sub {
	min-height: 1.3em;
	font-size: clamp(14px, 3.4vmin, 19px);
	font-weight: 800;
	color: #8C7A68;
}

#status-bar {
	position: relative;
	width: min(64vw, 420px);
	height: 16px;
	margin-top: 4px;
	border-radius: 10px;
	background: #EDE6DC;
	box-shadow: inset 0 2px 3px rgba(62, 52, 43, 0.14), 0 0 0 2px #FFFFFF;
	overflow: hidden;
}

#status-fill {
	position: absolute;
	left: 0;
	top: 0;
	bottom: 0;
	width: 0%;
	border-radius: 10px;
	background: linear-gradient(180deg, #B7A18A 0%, #8C7A68 100%);
	box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35);
	transition: width 0.35s ease;
}

/* Бегущие полоски: видно, что игра работает, даже когда браузер занят. */
#status-fill::after {
	content: '';
	position: absolute;
	inset: 0;
	background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.0) 0 10px, rgba(255, 255, 255, 0.22) 10px 20px);
	background-size: 28px 28px;
	animation: stripes 0.9s linear infinite;
}

@keyframes stripes {
	from { background-position: 0 0; }
	to { background-position: 28px 0; }
}

#status-tip {
	max-width: min(80vw, 520px);
	margin-top: 8px;
	font-size: clamp(12px, 2.8vmin, 15px);
	font-weight: 700;
	line-height: 1.4;
	color: #8A7D70;
	text-align: center;
	transition: opacity 0.4s ease;
}

#status-ios {
	display: none;
	position: absolute;
	left: 50%;
	bottom: calc(10px + env(safe-area-inset-bottom));
	transform: translateX(-50%);
	width: max-content;
	max-width: min(84vw, 560px);
	padding: 8px 14px;
	border-radius: 14px;
	background: rgba(255, 255, 255, 0.75);
	box-shadow: 0 0 0 2px #E2D7C9;
	font-size: clamp(12px, 2.8vmin, 14px);
	font-weight: 700;
	line-height: 1.35;
	color: #6E5E4E;
	text-align: center;
}

#status-notice {
	display: none;
	max-width: 520px;
	margin: 0 2rem;
	padding: 1rem 1.2rem;
	border-radius: 16px;
	background: #FFFFFF;
	box-shadow: 0 0 0 2px #C9B8A6;
	color: #C4554A;
	font-weight: 700;
	line-height: 1.35;
	text-align: center;
}

/* Телефон в альбомной ориентации: всё компактнее, чтобы влезло по высоте. */
@media (max-height: 520px) {
	#status-card {
		inset: 0 0 24% 0;
		gap: 6px;
	}
	#status-logo {
		width: 58px;
		height: 58px;
	}
	#status-title {
		margin-top: 2px;
		font-size: 34px;
	}
	#status-scene {
		height: 40%;
	}
}

/* --- Окно стартового экрана: имя нового мира -------------------------------------------------
   Это настоящее HTML-поле: только по нажатию на него Safari показывает клавиатуру. */

#dlg {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: flex;
	justify-content: center;
	align-items: center;
	padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
	background: rgba(46, 33, 23, 0.42);
	font-family: ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
	touch-action: manipulation;
	opacity: 0;
	transition: opacity 0.18s ease;
}

#dlg.shown {
	opacity: 1;
}

#dlg[hidden] {
	display: none;
}

.dlg-card {
	width: min(440px, 100%);
	max-height: 100%;
	overflow: auto;
	box-sizing: border-box;
	padding: 20px 20px 18px;
	border-radius: 22px;
	background: #FBF8F3;
	box-shadow: 0 0 0 2px #E6DACB, 0 18px 40px rgba(46, 33, 23, 0.28);
	color: #3E342B;
	transform: scale(0.96);
	transition: transform 0.2s cubic-bezier(0.2, 1.4, 0.4, 1);
}

#dlg.shown .dlg-card {
	transform: scale(1);
}

.dlg-title {
	font-size: 22px;
	font-weight: 900;
}

.dlg-text {
	margin-top: 6px;
	font-size: 15px;
	font-weight: 700;
	line-height: 1.4;
	color: #8A7D70;
}

.dlg-text:empty {
	display: none;
}

.dlg-field {
	display: block;
	width: 100%;
	box-sizing: border-box;
	margin-top: 14px;
	padding: 12px 14px;
	border: 2px solid #E6DACB;
	border-radius: 14px;
	outline: none;
	background: #FFFFFF;
	color: #3E342B;
	font: inherit;
	font-size: 17px;
	font-weight: 800;
	-webkit-user-select: text;
	user-select: text;
	-webkit-touch-callout: default;
}

.dlg-field:focus {
	border-color: #E8643C;
}

.dlg-buttons {
	display: flex;
	flex-wrap: wrap;
	gap: 10px;
	margin-top: 16px;
}

.dlg-buttons button {
	flex: 1 1 120px;
	min-height: 48px;
	padding: 10px 14px;
	border: 0;
	border-radius: 14px;
	background: #EDE8E1;
	color: #3E342B;
	font: inherit;
	font-size: 16px;
	font-weight: 900;
	text-align: center;
	cursor: pointer;
	-webkit-appearance: none;
	appearance: none;
}

.dlg-buttons button:active {
	transform: scale(0.97);
}

.dlg-buttons button.primary {
	background: #E8643C;
	color: #FFFFFF;
	box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.16);
}

/* Телефон боком: окно у верхнего края, чтобы его не закрыла клавиатура. */
@media (max-height: 520px) {
	#dlg {
		align-items: flex-start;
	}
	.dlg-card {
		padding: 14px 16px 12px;
	}
	.dlg-title {
		font-size: 19px;
	}
	.dlg-buttons {
		margin-top: 12px;
	}
	.dlg-buttons button {
		min-height: 42px;
	}
}

.blade {
	transform-origin: 0 0;
	animation: spin 6s linear infinite;
}

@keyframes spin {
	from { transform: rotate(0deg); }
	to { transform: rotate(360deg); }
}

.smoke {
	animation: puff 3.2s ease-out infinite;
	transform-box: fill-box;
	transform-origin: center;
}

@keyframes puff {
	0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
	20% { opacity: 0.7; }
	100% { transform: translate(10px, -40px) scale(1.6); opacity: 0; }
}

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"mt/index.wasm":38820072,"index.pck":19917192,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};

(function () {
	const overlay = document.getElementById('status');
	const fill = document.getElementById('status-fill');
	const sub = document.getElementById('status-sub');
	const tip = document.getElementById('status-tip');
	const notice = document.getElementById('status-notice');
	const bar = document.getElementById('status-bar');

	// Загрузка файлов — первые 45 % полосы, остальное — подготовка графики и мира в игре.
	const DOWNLOAD_SHARE = 0.45;
	let shown = 0;
	let finished = false;

	function setProgress(fraction, text) {
		if (finished) {
			return;
		}
		shown = Math.max(shown, Math.min(1, fraction));
		fill.style.width = (shown * 100).toFixed(1) + '%';
		if (text) {
			sub.textContent = text;
		}
	}

	function hideOverlay() {
		if (finished) {
			return;
		}
		finished = true;
		fill.style.width = '100%';
		overlay.classList.add('gone');
		setTimeout(() => overlay.remove(), 800);
	}

	// --- Окна стартового экрана ------------------------------------------------------------
	// Игра вызывает их и получает ответ строкой в cb (пустая строка — «Отмена»).
	const dlg = document.getElementById('dlg');
	const card = dlg.querySelector('.dlg-card');
	let dlgDone = null;
	// Клавиши в полях ввода не должны доходить до игры.
	['keydown', 'keyup', 'keypress'].forEach((type) => dlg.addEventListener(type, (e) => e.stopPropagation()));

	function el(tag, cls, text) {
		const e = document.createElement(tag);
		if (cls) {
			e.className = cls;
		}
		if (text) {
			e.textContent = text;
		}
		return e;
	}

	function row(parent) {
		const r = el('div', 'dlg-buttons');
		parent.appendChild(r);
		return r;
	}

	function button(parent, text, primary, onClick) {
		const b = el('button', primary ? 'primary' : '', text);
		b.type = 'button';
		b.addEventListener('click', onClick);
		parent.appendChild(b);
		return b;
	}

	function openDialog(title, text, cb, build) {
		closeDialog('');
		card.textContent = '';
		card.appendChild(el('div', 'dlg-title', title));
		card.appendChild(el('div', 'dlg-text', text || ''));
		build(card);
		dlgDone = cb;
		dlg.hidden = false;
		requestAnimationFrame(() => dlg.classList.add('shown'));
	}

	function closeDialog(result) {
		if (dlg.hidden) {
			return;
		}
		dlg.classList.remove('shown');
		dlg.hidden = true;
		const done = dlgDone;
		dlgDone = null;
		const canvas = document.getElementById('canvas');
		if (canvas) {
			canvas.focus();
		}
		if (done) {
			done(result);
		}
	}

	function askName(title, text, value, okText, cb) {
		openDialog(title, text, cb, (c) => {
			const input = el('input', 'dlg-field');
			input.type = 'text';
			input.maxLength = 40;
			input.value = value;
			input.autocomplete = 'off';

	const MT_BASE = 'mt/' + GODOT_CONFIG['executable'];
	const MT_BOOT = 'everstead-mt-boot';

	function storage(key, value) {
		try {
			if (value === undefined) {

			}
			if (value === null) {
				localStorage.removeItem(key);
			} else {
				localStorage.setItem(key, value);
			}
		} catch (e) {

		}
		return null;

		if (storage('everstead-threads') === 'off') {

		}
		// Перезагрузка с помощником не дала изоляции (так бывает в некоторых браузерах) —
		// больше не перезагружаем зря при каждом запуске.
		if (reloaded && !isolated() && 'serviceWorker' in navigator && navigator.serviceWorker.controller) {
			storage('everstead-coi-useless', '1');
		}
		if (isolated() || !want) {
			return Promise.resolve(want && isolated());
		}
		return registerHelper().then((ok) => {
			if (storage('everstead-coi-useless')) {
				return false;
			}
			// Помощник только что встал: страница станет изолированной после перезагрузки (один раз).
			if (ok && !reloaded && navigator.serviceWorker.controller) {
				try {
					sessionStorage.setItem('everstead-coi-reload', '1');
				} catch (e) {
					return false;
				}
				window.location.reload();
				return new Promise(() => {});
			}
			return false;
		});
	}

	// --- Очистка кэша ---------------------------------------------------------------------
	// Кнопка «Очистить кэш» в настройках: файлы игры скачиваются заново мимо кэша браузера
	// (бывает, что после обновления он отдаёт старую версию), и страница перезапускается.
	// Миры и настройки лежат в IndexedDB — их это не касается; игра сохраняет мир заранее.
	let engineBase = GODOT_CONFIG['executable'];

	function clearCache() {
		const files = [window.location.href.split('#')[0], engineBase + '.js', engineBase + '.wasm',
			GODOT_CONFIG['executable'] + '.pck'];
		let status = null;
		let done = 0;
		openDialog('Обновляем игру', 'Скачиваем свежую версию, потом игра перезапустится. Миры и настройки останутся.', null, (c) => {
			status = el('div', 'dlg-text', 'Скачано 0 из ' + files.length);
			c.appendChild(status);
		});
		const step = () => {
			done += 1;
			if (status) {
				status.textContent = 'Скачано ' + done + ' из ' + files.length;
			}
		};
		// cache: 'reload' — мимо кэша, и свежий ответ сразу ложится в кэш вместо старого.
		const jobs = files.map((url) => fetch(url, { cache: 'reload' }).then((r) => r.arrayBuffer()).catch(() => null).then(step));
		if ('caches' in window) {
			jobs.push(caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k)))).catch(() => null));
		}
		if ('serviceWorker' in navigator) {
			jobs.push(navigator.serviceWorker.getRegistrations().then((regs) => Promise.all(regs.map((r) => r.update()))).catch(() => null));
		}
		// Отметки о неудачных запусках многопоточной версии — тоже заново (выбор игрока остаётся).
		storage(MT_BOOT, null);
		storage('everstead-coi-useless', null);
		return Promise.all(jobs).then(() => setTimeout(() => window.location.reload(), 300));
	}

	// Игра сама сообщает, как идёт подготовка, и когда мир готов.
	window.everstead = {
		progress: (fraction, text) => setProgress(DOWNLOAD_SHARE + (1 - DOWNLOAD_SHARE) * fraction, text),
		ready: () => {
			storage(MT_BOOT, null);
			hideOverlay();
		},
		// Настройка «Многопоточность»: 'auto' или 'off' (применится при следующем запуске).
		setThreads: (mode) => storage('everstead-threads', mode === 'off' ? 'off' : null),
		threadsMode: () => storage('everstead-threads') || 'auto',
		reload: () => window.location.reload(),
		clearCache: clearCache,
		askName: askName,
	};

	const tips = [
		'Срубите пару деревьев и постройте лесопилку — из брёвен выйдут доски.',
		'Два пальца вверх-вниз наклоняют камеру, щипок — приближает.',
		'Три быстрых касания двумя пальцами прячут интерфейс.',
		'В настройках есть раздел «Управление» с подсказками.',
		'Ставьте метки на карте, чтобы не потерять свои деревни.',
		'Огонь гаснет под дождём и на сильном ветру.',
	];
	let tipIndex = Math.floor(Math.random() * tips.length);
	tip.textContent = tips[tipIndex];
	setInterval(() => {
		tip.style.opacity = 0;
		setTimeout(() => {
			tipIndex = (tipIndex + 1) % tips.length;
			tip.textContent = tips[tipIndex];
			tip.style.opacity = 1;
		}, 400);
	}, 4500);

	// iPhone и iPad: подсказываем, как запускать игру во весь экран (полноэкранного режима в Safari нет).
	// Safari позволяет масштабировать страницу щипком даже с user-scalable=no — запрещаем.
	['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
		document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
	});
	document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

	const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent)
		|| (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	if (isIOS && !navigator.standalone) {
		document.getElementById('status-ios').style.display = 'block';
	}

	function displayFailureNotice(err) {
		console.error(err);
		let text = 'Не удалось запустить игру.';
		if (err instanceof Error) {
			text = err.message;
		} else if (typeof err === 'string') {
			text = err;
		}
		while (notice.lastChild) {
			notice.removeChild(notice.lastChild);
		}
		text.split('\n').forEach((line) => {
			notice.appendChild(document.createTextNode(line));
			notice.appendChild(document.createElement('br'));
		});
		notice.style.display = 'block';
		bar.style.display = 'none';
		sub.textContent = '';
		finished = true;
	}

	function startEngine(threads) {
		const base = threads ? MT_BASE : GODOT_CONFIG['executable'];
		engineBase = base;
		const script = document.createElement('script');
		script.src = base + '.js';
		script.onerror = () => {
			if (threads) {
				// Многопоточной сборки нет на сервере — обычная.
				script.remove();
				startEngine(false);
			} else {
				displayFailureNotice('Не удалось загрузить игру. Проверьте интернет и обновите страницу.');
			}
		};
		script.onload = () => {
			const missing = Engine.getMissingFeatures({ threads: threads });
			if (missing.length !== 0) {
				if (threads) {
					storage(MT_BOOT, String(Date.now()));
					window.location.reload();
					return;
				}
				displayFailureNotice('Браузер не поддерживает то, что нужно игре:\n' + missing.join('\n')
					+ '\nПопробуйте свежий Safari, Chrome или Firefox.');
				return;
			}
			const config = Object.assign({}, GODOT_CONFIG, { 'executable': base, 'mainPack': GODOT_CONFIG['executable'] + '.pck' });
			const engine = new Engine(config);
			if (threads) {
				// Метка снимается, когда игра покажет первый экран (everstead.ready).
				storage(MT_BOOT, String(Date.now()));
			}
			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						setProgress(DOWNLOAD_SHARE * current / total, current < total ? 'Загружаем игру…' : 'Запускаем движок…');
					}
				},
			}).then(() => {
				setProgress(DOWNLOAD_SHARE + 0.02, 'Запускаем движок…');
				// Страховка: если игра так и не сообщила о готовности, не держим экран вечно.
				setTimeout(hideOverlay, 120000);
			}, (err) => {
				if (threads) {
					// Многопоточная не запустилась — сразу обычная (метка запуска осталась).
					console.error(err);
					window.location.reload();
					return;
				}
				displayFailureNotice(err);
			});
		};
		document.body.appendChild(script);
	}

	chooseBuild().then(startEngine);
}());
		</script>
	</body>
</html>
