# Сборка Everstead для iPhone/iPad без Apple Developer: Godot выгружает проект Xcode,
# xcodebuild собирает его без подписи, а .ipa подписывает уже Sideloadly или AltStore
# бесплатным Apple ID при установке на устройство.
# Запуск: метка ios-* (git tag ios-3 && git push origin ios-3) или кнопка Run workflow.
name: iOS IPA

on:
  workflow_dispatch:
  push:
    tags: ["ios-*"]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      # Шаблоны Godot собраны с iOS SDK из Xcode 26: со старым Xcode не слинковать.
      - name: Самый новый Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xc=$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc"
          xcodebuild -version

      - name: Godot и шаблоны экспорта для iOS
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz templates/ios.zip templates/version.txt -d "$dest"
          rm -f templates.tpz godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Импорт ресурсов
        run: "\"$GODOT\" --headless --path . --import"

      - name: Проект Xcode
        run: |
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/Everstead.ipa
          ls -la build/ios

      - name: Сборка без подписи
        run: |
          set -o pipefail
          cd build/ios
          project=$(ls -d *.xcodeproj | head -1)
          scheme=$(xcodebuild -list -json -project "$project" | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "project $project, scheme $scheme"
          xcodebuild -project "$project" -scheme "$scheme" -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -archivePath Everstead.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            | tail -n 60
          mkdir -p Payload
          cp -R Everstead.xcarchive/Products/Applications/*.app Payload/
          rm -f Everstead.ipa
          zip -qry Everstead.ipa Payload
          ls -la Everstead.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Everstead-iOS
          path: build/ios/Everstead.ipa
          retention-days: 14

      - name: Выпуск с .ipa
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/Everstead.ipa
          name: Everstead для iPhone (${{ github.ref_name }})
          prerelease: true
          body: |
            Неподписанная сборка для iPhone и iPad (iOS 14+).
            Установка бесплатно: Sideloadly или AltStore/SideStore со своим Apple ID — приложение
            работает 7 дней, потом его нужно переустановить тем же способом.
